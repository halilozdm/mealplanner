<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5fde3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Menü">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Haftalık Menü</title>
<style>
  /* ---- Yalın Sofra design tokens ---- */
  :root {
    --bg: #f5fde3;
    --bg-low: #eff7dd;
    --bg-mid: #e9f1d8;
    --bg-high: #e4ebd2;
    --bg-highest: #dee6cd;
    --card: #ffffff;
    --text: #171e0e;
    --muted: #45483e;
    --faint: #75786d;
    --line: #c5c8bb;
    --line-soft: #e5e5d8;
    --primary: #516138;
    --primary-2: #697a4f;
    --primary-soft: #d6eab5;
    --on-primary: #ffffff;
    --terra: #8b4b22;
    --terra-2: #a96338;
    --terra-soft: #ffdbc9;
    --error: #ba1a1a;
    --error-soft: #ffdad6;
    --on-error-soft: #93000a;
    --shadow: 0 4px 15px rgba(23,30,14,.05);
    --shadow-2: 0 8px 24px rgba(23,30,14,.12);
    --r: 16px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
    --ease: cubic-bezier(.22,.8,.36,1);
    --nav-h: 76px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    line-height: 1.5; font-size: 16px;
    touch-action: manipulation;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
  button:disabled { cursor: default; }
  svg.i { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
  #app { min-height: 100dvh; display: flex; flex-direction: column; }
  main { flex: 1; padding: 16px 20px calc(var(--nav-h) + 24px + var(--safe-b)); width: 100%; }
  @media (min-width: 720px) {
    main, .top-in { max-width: 680px; margin: 0 auto; }
    .nav, .bar { left: 50%; right: auto; transform: translateX(-50%); width: 680px; }
  }

  /* ---- view transition ---- */
  .view { animation: viewIn .32s var(--ease) both; }
  @keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .rise { animation: rise .42s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .view, .rise, .sheet, .scrim, .toast, .fab, .meal, .day { animation: none !important; transition: none !important; } }

  /* ---- top bar ---- */
  .top {
    position: sticky; top: 0; z-index: 5;
    background: rgba(245,253,227,.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    padding-top: var(--safe-t); box-shadow: 0 1px 8px rgba(0,0,0,.04);
  }
  .top-in { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 0 20px; }
  .top h1 { font-size: 20px; margin: 0; font-weight: 600; flex: 1; letter-spacing: -.01em; line-height: 1.2; min-width: 0; }
  .top .sub { font-size: 13px; color: var(--muted); display: block; font-weight: 400; margin-top: 2px; letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .logo { width: 32px; height: 32px; border-radius: 8px; background: var(--card); display: grid; place-items: center; color: var(--primary); box-shadow: var(--shadow); }
  .logo svg { width: 22px; height: 22px; }
  .back { width: 40px; height: 40px; border-radius: 50%; background: var(--bg-mid); display: grid; place-items: center; color: var(--text); transition: background .15s; }
  .back:active { background: var(--bg-highest); }
  .datebtn {
    position: relative; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--primary);
    padding: 8px 12px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow); white-space: nowrap;
  }
  .datebtn input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; }
  .datebtn svg.i { width: 16px; height: 16px; }

  /* ---- home: stats ---- */
  .stats { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 16px; }
  .stat {
    display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; padding: 8px 14px; border-radius: 999px;
    background: var(--card); color: var(--muted); box-shadow: var(--shadow); transition: transform .2s var(--ease);
  }
  .stat svg.i { width: 16px; height: 16px; }
  .stat.ok { background: var(--primary); color: var(--on-primary); }
  .stat.terra { background: var(--terra-2); color: #fff; }
  .stat.warn { background: var(--error-soft); color: var(--on-error-soft); }

  .banner {
    display: flex; gap: 10px; align-items: flex-start; padding: 14px 16px; border-radius: var(--r); font-size: 15px; line-height: 1.4;
    background: var(--bg-mid); color: var(--muted); margin-bottom: 10px;
  }
  .banner svg.i { margin-top: 2px; }
  .banner.warn { background: var(--error-soft); color: var(--on-error-soft); }
  .banner b { font-weight: 600; }
  .banners { margin-bottom: 16px; }

  /* ---- home: day cards ---- */
  .days { display: grid; gap: 14px; }
  .day {
    position: relative; background: var(--card); border-radius: var(--r); padding: 16px; text-align: left; width: 100%;
    box-shadow: var(--shadow); display: grid; gap: 10px; overflow: hidden;
    transition: transform .18s var(--ease), box-shadow .18s var(--ease);
  }
  .day:active { transform: scale(.985); }
  .day.done::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--primary); }
  .day .head { display: flex; align-items: center; justify-content: space-between; }
  .day .dn { font-weight: 600; font-size: 20px; letter-spacing: -.01em; }
  .day .dn span { color: var(--muted); font-weight: 500; font-size: 17px; margin-left: 6px; }
  .day .dots { display: flex; gap: 5px; }
  .day .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--bg-highest); transition: background .3s, transform .3s var(--ease); }
  .day .dots i.on { background: var(--primary); }
  .day .rows { display: grid; gap: 6px; }
  .day .row {
    display: grid; grid-template-columns: 62px 1fr; gap: 10px; align-items: center; min-height: 44px;
    padding: 10px 12px; border-radius: 12px; background: var(--bg-low); font-size: 15px;
  }
  .day .row.on { background: var(--bg-mid); }
  .day .row b { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
  .day .row span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .day .row .empty { color: var(--faint); }
  .day .row.bad { background: var(--error-soft); }
  .day .row.bad span, .day .row.bad b { color: var(--on-error-soft); }
  .day .cta {
    display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 72px; border-radius: 12px;
    background: var(--bg-low); color: var(--faint); font-weight: 500; font-size: 16px; border: 1.5px dashed var(--line);
  }
  .day.blank .dn { color: var(--faint); }
  .shuffle .day .row.on { animation: rowPop .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 60ms); }
  @keyframes rowPop { 0% { transform: translateX(-6px); opacity: 0; } 100% { transform: none; opacity: 1; } }

  /* ---- bottom nav ---- */
  .nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    background: rgba(245,253,227,.9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--line-soft);
    padding: 8px 8px calc(8px + var(--safe-b)); display: grid; grid-template-columns: repeat(5, 1fr); align-items: end;
  }
  .nav .ni {
    display: grid; justify-items: center; gap: 3px; padding: 6px 0; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .04em;
    min-height: 56px; align-content: center; border-radius: 12px; transition: color .15s, transform .15s var(--ease);
  }
  .nav .ni svg.i { width: 24px; height: 24px; }
  .nav .ni.on { color: var(--primary); }
  .nav .ni:active { transform: scale(.94); }
  .nav .ni:disabled { opacity: .4; }
  .fab-wrap { display: grid; justify-items: center; align-content: end; }
  .fab {
    width: 60px; height: 60px; border-radius: 50%; margin-top: -30px; background: var(--primary); color: var(--on-primary);
    display: grid; place-items: center; box-shadow: var(--shadow-2), 0 0 0 6px var(--bg);
    transition: transform .18s var(--ease), background .2s;
  }
  .fab svg.i { width: 26px; height: 26px; }
  .fab:active { transform: scale(.94); }
  .fab:disabled { background: var(--bg-highest); color: var(--faint); box-shadow: 0 0 0 6px var(--bg); }
  .fab .spin { width: 26px; height: 26px; border: 3px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fab-wrap .lbl { font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--muted); margin-top: 4px; }

  /* ---- wizard bar ---- */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    background: rgba(245,253,227,.9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line-soft);
    padding: 12px 20px calc(12px + var(--safe-b)); display: flex; gap: 12px; justify-content: space-between;
  }
  .btn {
    min-height: 52px; padding: 0 22px; border-radius: 999px; font-weight: 600; font-size: 16px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--bg-mid); color: var(--text); transition: transform .15s var(--ease), filter .15s;
  }
  .btn.primary { background: var(--primary); color: var(--on-primary); box-shadow: var(--shadow-2); }
  .btn:active { transform: scale(.96); }
  .btn:disabled { opacity: .4; }

  /* ---- menu sheet ---- */
  .scrim { position: fixed; inset: 0; z-index: 6; background: rgba(23,30,14,.35); animation: fade .2s both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .sheet {
    position: fixed; left: 12px; right: 12px; bottom: calc(12px + var(--safe-b)); z-index: 7;
    background: var(--card); border-radius: 24px; box-shadow: var(--shadow-2); padding: 8px 8px 8px;
    animation: sheetIn .3s var(--ease) both;
  }
  @media (min-width: 720px) { .sheet { left: 50%; right: auto; width: 420px; transform: translateX(-50%); animation-name: sheetInC; } }
  @keyframes sheetIn { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes sheetInC { from { transform: translate(-50%, 30px); opacity: 0; } to { transform: translateX(-50%); opacity: 1; } }
  .sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line-soft); margin: 6px auto 10px; }
  .sheet .item {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 16px 16px; border-radius: 16px; font-size: 16px; font-weight: 500;
    transition: background .15s;
  }
  .sheet .item:active { background: var(--bg-low); }
  .sheet .item .ic { width: 40px; height: 40px; border-radius: 12px; background: var(--bg-mid); color: var(--primary); display: grid; place-items: center; }
  .sheet .item small { display: block; font-size: 13px; color: var(--muted); font-weight: 400; }
  .sheet .item.danger { color: var(--error); }
  .sheet .item.danger .ic { background: var(--error-soft); color: var(--error); }
  .sheet .cancel { width: 100%; padding: 14px; text-align: center; font-weight: 600; color: var(--muted); border-top: 1px solid var(--line-soft); margin-top: 4px; }

  /* ---- wizard ---- */
  .progress { height: 4px; border-radius: 2px; background: var(--bg-highest); margin: 0 0 20px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--primary); border-radius: 2px; transition: width .4s var(--ease); }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); position: relative; margin: 0 0 20px; }
  .steps::before { content: ""; position: absolute; left: 12.5%; right: 12.5%; top: 18px; height: 2px; background: var(--bg-highest); }
  .step { display: grid; justify-items: center; gap: 6px; position: relative; padding: 0 4px; }
  .step .c {
    width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 14px;
    background: var(--bg-mid); color: var(--muted); transition: background .25s, color .25s, transform .25s var(--ease);
  }
  .step .c svg.i { width: 18px; height: 18px; }
  .step .l { font-size: 13px; font-weight: 500; color: var(--muted); }
  .step .t { font-size: 11px; color: var(--faint); margin-top: -4px; }
  .step.set .c { background: var(--primary); color: var(--on-primary); }
  .step.cur .c { background: var(--primary-2); color: var(--on-primary); transform: scale(1.12); box-shadow: 0 0 0 4px var(--primary-soft); }
  .step.cur .l { color: var(--primary); font-weight: 600; }
  .step.set.cur .c { background: var(--primary); }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 20px 14px; margin: 0 -20px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; padding: 10px 18px; border-radius: 999px; background: var(--bg-mid); font-size: 14px; font-weight: 600; color: var(--muted); min-height: 40px;
    transition: background .2s, color .2s, transform .15s var(--ease);
  }
  .chip:active { transform: scale(.95); }
  .chip.on { background: var(--primary); color: var(--on-primary); box-shadow: var(--shadow); }

  .current {
    display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: var(--r); margin: 0 0 14px;
    background: var(--primary-2); color: var(--on-primary); font-size: 15px; font-weight: 500; animation: rise .3s var(--ease) both;
  }
  .current.hint { background: var(--bg-mid); color: var(--muted); font-weight: 400; }
  .current .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .current .rm { font-size: 13px; font-weight: 600; padding: 7px 12px; border-radius: 999px; background: rgba(255,255,255,.22); color: #fff; }

  /* ---- meal cards ---- */
  .meals { display: grid; gap: 12px; }
  .meal {
    position: relative; background: var(--card); border-radius: var(--r); padding: 14px; text-align: left; width: 100%;
    display: grid; grid-template-columns: 76px 1fr; gap: 12px; align-items: start; box-shadow: var(--shadow);
    border: 1.5px solid transparent; transition: border-color .2s, transform .15s var(--ease), box-shadow .2s;
  }
  .meal:active { transform: scale(.99); }
  .meal.sel { border-color: var(--primary); box-shadow: var(--shadow-2); }
  .meal .thumb { width: 76px; height: 76px; border-radius: 12px; object-fit: cover; background: var(--bg-mid); display: block; }
  .meal .tile {
    width: 76px; height: 76px; border-radius: 12px; display: grid; place-items: center; font-weight: 700; font-size: 18px; letter-spacing: .02em;
    background: linear-gradient(160deg, var(--primary-soft), var(--bg-mid)); color: var(--primary);
  }
  .meal .body { min-width: 0; display: grid; gap: 4px; }
  .meal .head { display: flex; gap: 8px; align-items: flex-start; }
  .meal .title { font-weight: 600; font-size: 17px; line-height: 1.3; flex: 1; letter-spacing: -.005em; }
  .meal .use { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: var(--bg-mid); color: var(--muted); white-space: nowrap; margin-top: 2px; }
  .meal .use.over { background: var(--error-soft); color: var(--on-error-soft); }
  .meal .check { position: absolute; top: 12px; right: 12px; width: 24px; height: 24px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; animation: pop .25s var(--ease) both; }
  .meal .check svg.i { width: 14px; height: 14px; stroke-width: 3; }
  .meal.sel .use { margin-right: 28px; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
  .meal .desc { grid-column: 1 / -1; font-size: 14px; color: var(--muted); margin: 0; padding: 0; list-style: none; line-height: 1.45; }
  .meal .desc li { padding-left: 12px; position: relative; }
  .meal .desc li::before { content: ""; position: absolute; left: 0; top: .62em; width: 5px; height: 5px; border-radius: 50%; background: var(--primary-soft); }
  .meal .desc li.hidden { display: none; }
  .meal.open .desc li.hidden { display: list-item; animation: fade .25s both; }
  .meal .foot { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-top: 2px; }
  .meal .more { font-size: 13px; font-weight: 600; color: var(--primary); display: inline-flex; align-items: center; gap: 4px; padding: 6px 0; }
  .meal .more svg.i { width: 14px; height: 14px; transition: transform .25s var(--ease); }
  .meal.open .more svg.i { transform: rotate(180deg); }
  .meal .tarif { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--primary); padding: 8px 12px; border-radius: 999px; background: var(--bg-low); margin-left: auto; }
  .meal .tarif svg.i { width: 16px; height: 16px; }
  .meal .warnline { grid-column: 1 / -1; display: flex; gap: 6px; align-items: flex-start; font-size: 13px; color: var(--terra); }
  .meal .warnline svg.i { width: 16px; height: 16px; margin-top: 2px; }

  .empty-list { color: var(--faint); text-align: center; padding: 40px 10px; }

  /* ---- recipes browser ---- */
  .page-title { font-size: 32px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; margin: 4px 0 2px; }
  .page-sub { color: var(--muted); font-size: 16px; margin: 0 0 18px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line-soft); margin: 0 0 14px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs .tab { flex: 1 0 auto; padding: 10px 10px 12px; font-size: 15px; font-weight: 500; color: var(--muted); position: relative; white-space: nowrap; transition: color .2s; }
  .tabs .tab::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2.5px; border-radius: 2px; background: var(--primary); transform: scaleX(0); transition: transform .25s var(--ease); }
  .tabs .tab.on { color: var(--primary); font-weight: 600; }
  .tabs .tab.on::after { transform: scaleX(1); }
  .tabs .tab small { color: var(--faint); font-weight: 400; margin-left: 3px; }

  /* ---- recipe viewer ---- */
  .recipe-img { display: block; width: 100%; height: auto; border-radius: var(--r); box-shadow: var(--shadow); background: var(--bg-mid); min-height: 200px; }
  .recipe-card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; margin-top: 16px; }
  .recipe-card .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; color: var(--terra); text-transform: uppercase; }
  .recipe-card h2 { margin: 4px 0 12px; font-size: 24px; font-weight: 600; letter-spacing: -.01em; line-height: 1.25; }
  .recipe-card ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; color: var(--muted); font-size: 15px; }
  .recipe-card li { padding-left: 14px; position: relative; }
  .recipe-card li::before { content: ""; position: absolute; left: 0; top: .6em; width: 6px; height: 6px; border-radius: 50%; background: var(--primary-soft); }

  /* ---- toast, skeleton ---- */
  .toast {
    position: fixed; left: 50%; bottom: calc(var(--nav-h) + 20px + var(--safe-b)); transform: translateX(-50%) translateY(10px);
    background: #2c3322; color: #ecf4db; padding: 12px 18px; border-radius: 999px; font-size: 14px; font-weight: 500; z-index: 9; opacity: 0;
    transition: opacity .25s, transform .25s var(--ease); pointer-events: none; white-space: nowrap; box-shadow: var(--shadow-2);
  }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  .sk { border-radius: var(--r); background: linear-gradient(90deg, var(--bg-mid) 25%, var(--bg-low) 50%, var(--bg-mid) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }
</style>
</head>
<body>
<div id="app">
  <header class="top"><div class="top-in"><div class="logo"></div><h1>Haftalık Menü</h1></div></header>
  <main>
    <div class="stats"><span class="sk" style="width:110px;height:36px;border-radius:999px"></span><span class="sk" style="width:90px;height:36px;border-radius:999px"></span></div>
    <div class="days"><div class="sk" style="height:250px"></div><div class="sk" style="height:250px"></div><div class="sk" style="height:250px"></div></div>
  </main>
</div>
<div id="toast" class="toast"></div>
<script src="vendor/jspdf.umd.min.js" defer></script>
<script src="vendor/jspdf.plugin.autotable.min.js" defer></script>
<script type="module" src="app.js"></script>
</body>
</html>
